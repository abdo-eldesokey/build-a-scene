name: bas
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.8 # pyembree is only available for python 3.8
  - pytorch=2.3.1
  - torchvision=0.18.1
  - pytorch-cuda=12.1
  - pip
  - pip:
      - diffusers==0.30.3
      - ipykernel
      - ipywidgets
      - transformers==4.46.3
      - accelerate==1.0.1
      - peft==0.13.2
      - opencv-python==4.11.0.86      
      - pyrender
      - einops==0.8.1
      - pyembree==0.2.11
      - matplotlib
      - scikit-learn==1.3.2
      - ultralytics==8.1.19 # For evaluation with YOLO
      - scikit-image
      - git+https://github.com/openai/CLIP.git

